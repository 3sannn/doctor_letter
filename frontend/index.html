<!DOCTYPE html>
<html lang="en">
  <head> 
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f7" />
    <title>Doctor Letter</title>
    <link rel="icon" href="/images/logo-mark.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/images/logo-mark.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap"
    />
    <link rel="preload" href="/images/brain-illustration.png" as="image" />
    <link rel="stylesheet" href="css/main.css?v=25" />
  </head>
  <body class="sign-in-page">
    <div class="sign-in-split">
      <aside class="sign-in-visual" aria-hidden="true">
        <img
          class="sign-in-brain"
          src="/images/brain-illustration.png"
          alt=""
          width="720"
          height="720"
          decoding="async"
          fetchpriority="high"
        />
      </aside>

      <section class="sign-in-panel">
        <div class="sign-in-panel-inner sign-in-enter">
          <header class="sign-in-brand">
            <div class="brand brand-with-logo">
              <img
                class="brand-logo"
                src="/images/logo-mark.jpg"
                alt=""
                width="40"
                height="40"
                decoding="async"
              />
              <span class="brand-text">Doctor <span class="brand-accent">Letter</span></span>
            </div>
          </header>

          <h1 class="sign-in-title">Sign in</h1>
          <p class="sign-in-lead">
            Enter your mobile number to open your workspace and pick up your letters.
          </p>

          <div id="alert" aria-live="polite"></div>

          <form id="entry-form" class="sign-in-form" novalidate>
            <div class="field">
              <label for="mobile">Mobile number</label>
              <input
                id="mobile"
                name="mobile"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                maxlength="15"
                pattern="[0-9]{10,15}"
                placeholder="10-digit mobile number"
                required
                aria-describedby="entry-hint"
              />
              <span class="hint" id="entry-hint">
                Numbers only. We keep you signed in with a secure cookie on this device.
              </span>
            </div>

            <div class="visually-hidden" aria-hidden="true">
              <label for="company">Company</label>
              <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" />
            </div>

            <div class="btn-row sign-in-submit">
              <button type="submit" class="btn btn-primary btn-pill" id="entry-submit">Open workspace</button>
            </div>
          </form>

          <p class="sign-in-trust">
            <span id="trust-icon" aria-hidden="true"></span>
            <span>We handle patient data with care. <a href="/privacy">Privacy and data handling</a></span>
          </p>
        </div>
      </section>
    </div>

    <script src="js/profile-cache.js?v=2" defer></script>
    <script src="js/workspace-cache.js?v=2" defer></script>
    <script src="js/http-client.js?v=2" defer></script>
    <script src="js/api.js?v=2" defer></script>
    <script src="js/icons.js?v=2" defer></script>
    <script src="js/paths.js?v=1" defer></script>
    <script src="js/ui.js?v=2" defer></script>
    <script src="js/entry-page.js?v=3" defer></script>
    <script defer>
      document.addEventListener("DOMContentLoaded", () => {
        const node = document.getElementById("trust-icon");
        if (node && typeof Icons !== "undefined") {
          node.innerHTML = Icons.svg("shield", "icon");
        }
      });
    </script>
  </body>
</html>
