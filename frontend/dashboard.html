<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efece6" />
    <title>Workspace | Doctor Letter</title>
    <link rel="icon" href="/images/logo-mark.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/images/logo-mark.jpg" />
    <link rel="stylesheet" href="css/main.css?v=25" />
  </head>
  <body class="page-app page-dashboard" data-nav-page="dashboard">
    <header id="app-navbar" role="banner"></header>
    <div class="shell app-shell">
      <main class="grid two motion-stagger">
        <section class="card hero card-accent workspace-primary">
          <p class="workspace-greeting" id="workspace-greeting" hidden>Good day</p>
          <h1 class="page-title">Your workspace</h1>
          <p class="subtle">Start a letter or open a draft. Finished PDFs are under Past letters.</p>
          <div class="workspace-actions section-gap">
            <a class="btn btn-primary" href="/templates">Create new letter</a>
            <div class="workspace-links">
              <a class="btn btn-secondary" href="/history">Past letters</a>
              <a class="btn btn-ghost" href="/profile">Your profile</a>
            </div>
          </div>
        </section>

        <section class="card">
          <h2 class="section-title">Saved drafts</h2>
          <p class="subtle">One draft per template. Remove any you do not need.</p>
          <div id="draft-alert" aria-live="polite"></div>
          <ul id="draft-list" class="history-list section-gap" aria-live="polite"></ul>
          <div class="btn-row btn-row--start section-gap-lg">
            <button type="button" class="btn btn-ghost" id="sign-out">Sign out</button>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a href="/privacy">Privacy and data handling</a>
      </footer>
    </div>

    <script src="js/profile-cache.js?v=2" defer></script>
    <script src="js/workspace-cache.js?v=2" defer></script>
    <script src="js/http-client.js?v=2" defer></script>
    <script src="js/api.js?v=2" defer></script>
    <script src="js/paths.js?v=1" defer></script>
    <script src="js/session.js?v=3" defer></script>
    <script src="js/icons.js?v=2" defer></script>
    <script src="js/app-nav.js?v=5" defer></script>
    <script src="js/ui.js?v=4" defer></script>
    <script src="js/dashboard-page.js?v=4" defer></script>
  </body>
</html>
