<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efece6" />
    <title>Your profile | Doctor Letter</title>
    <link rel="icon" href="/images/logo-mark.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/images/logo-mark.jpg" />
    <link rel="stylesheet" href="css/main.css?v=25" />
  </head>
  <body class="page-app page-profile" data-nav-page="profile">
    <header id="app-navbar" role="banner"></header>
    <div class="shell app-shell shell-narrow">
      <main class="card motion-rise">
        <h1 class="page-title">Your details</h1>
        <p class="subtle">This appears on your letters. Your mobile number is how you sign in.</p>
        <div id="alert" aria-live="polite"></div>

        <form id="profile-form" class="motion-stagger">
          <div class="field">
            <label for="mobile">Mobile number</label>
            <input id="mobile" type="text" disabled aria-readonly="true" />
          </div>
          <div class="field">
            <label for="full-name">Full name</label>
            <input id="full-name" type="text" autocomplete="name" />
          </div>
          <div class="field">
            <label for="registration">Registration number</label>
            <input id="registration" type="text" />
          </div>
          <div class="field">
            <label for="clinic-name">Clinic or hospital name</label>
            <input id="clinic-name" type="text" />
          </div>
          <div class="field">
            <label for="clinic-address">Clinic address</label>
            <input id="clinic-address" type="text" />
          </div>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary" id="profile-save">Save profile</button>
          </div>
        </form>

        <div class="profile-signout-mobile btn-row">
          <button type="button" class="btn btn-ghost profile-signout-btn" id="profile-sign-out">
            Sign out
          </button>
        </div>
      </main>
    </div>

    <script src="js/profile-cache.js?v=2" defer></script>
    <script src="js/workspace-cache.js?v=2" defer></script>
    <script src="js/http-client.js?v=2" defer></script>
    <script src="js/api.js?v=2" defer></script>
    <script src="js/paths.js?v=1" defer></script>
    <script src="js/session.js?v=3" defer></script>
    <script src="js/icons.js?v=2" defer></script>
    <script src="js/app-nav.js?v=5" defer></script>
    <script src="js/ui.js?v=5" defer></script>
    <script defer>
      document.addEventListener("DOMContentLoaded", () => {
        (async function init() {
          const profileSession = await Session.requireAuth();
          if (profileSession) {
            Ui.setMobileLabel(profileSession);
          }
          const alertBox = document.getElementById("alert");
          const saveBtn = document.getElementById("profile-save");
          const cached = ProfileCache.read();
          if (cached) {
            document.getElementById("mobile").value = cached.mobile;
            document.getElementById("full-name").value = cached.full_name || "";
            document.getElementById("registration").value = cached.registration_number || "";
            document.getElementById("clinic-name").value = cached.clinic_name || "";
            document.getElementById("clinic-address").value = cached.clinic_address || "";
          }
          const profile = await Api.getProfile();
          Ui.setMobileLabel(profile);
          document.getElementById("mobile").value = profile.mobile;
          document.getElementById("full-name").value = profile.full_name || "";
          document.getElementById("registration").value = profile.registration_number || "";
          document.getElementById("clinic-name").value = profile.clinic_name || "";
          document.getElementById("clinic-address").value = profile.clinic_address || "";

          document.getElementById("profile-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            Ui.clearAlert(alertBox);
            Ui.setButtonLoading(saveBtn, true, "Saving…");
            try {
              await Api.saveProfile({
                full_name: document.getElementById("full-name").value.trim(),
                registration_number: document.getElementById("registration").value.trim(),
                clinic_name: document.getElementById("clinic-name").value.trim(),
                clinic_address: document.getElementById("clinic-address").value.trim(),
              });
              Ui.showAlert(alertBox, "Profile saved.", "success");
            } catch {
              Ui.showAlert(alertBox, "Could not save. Try again.");
            } finally {
              Ui.setButtonLoading(saveBtn, false);
            }
          });
        })();
      });
    </script>
  </body>
</html>
