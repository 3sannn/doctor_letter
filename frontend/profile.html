<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your profile | Doctor Letter</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <div class="brand">Doctor <span>Letter</span></div>
        <a class="btn btn-ghost" href="dashboard.html">Workspace</a>
      </header>

      <main class="card">
        <h1 style="margin-top: 0">Your details</h1>
        <p class="subtle">
          This information is stored in your Neon database. Templates use it automatically.
        </p>
        <div id="alert" aria-live="polite"></div>

        <form id="profile-form">
          <div class="field">
            <label for="mobile">Mobile number</label>
            <input id="mobile" type="text" disabled />
          </div>
          <div class="field">
            <label for="full-name">Full name</label>
            <input id="full-name" type="text" autocomplete="name" />
          </div>
          <div class="field">
            <label for="registration">Registration number</label>
            <input id="registration" type="text" />
          </div>
          <div class="field">
            <label for="clinic-name">Clinic or hospital name</label>
            <input id="clinic-name" type="text" />
          </div>
          <div class="field">
            <label for="clinic-address">Clinic address</label>
            <input id="clinic-address" type="text" />
          </div>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary">Save profile</button>
          </div>
        </form>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/ui.js"></script>
    <script>
      (async function init() {
        await Session.requireAuth();
        const alertBox = document.getElementById("alert");
        const profile = await Api.getProfile();
        document.getElementById("mobile").value = profile.mobile;
        document.getElementById("full-name").value = profile.full_name || "";
        document.getElementById("registration").value = profile.registration_number || "";
        document.getElementById("clinic-name").value = profile.clinic_name || "";
        document.getElementById("clinic-address").value = profile.clinic_address || "";

        document.getElementById("profile-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          Ui.clearAlert(alertBox);
          try {
            await Api.saveProfile({
              full_name: document.getElementById("full-name").value.trim(),
              registration_number: document.getElementById("registration").value.trim(),
              clinic_name: document.getElementById("clinic-name").value.trim(),
              clinic_address: document.getElementById("clinic-address").value.trim(),
            });
            Ui.showAlert(alertBox, "Profile saved.", "success");
          } catch (error) {
            Ui.showAlert(alertBox, error.message);
          }
        });
      })();
    </script>
  </body>
</html>
