<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efece6" />
    <title>Past letters | Doctor Letter</title>
    <link rel="icon" href="/images/logo-mark.jpg" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/images/logo-mark.jpg" />
    <link rel="stylesheet" href="css/main.css?v=25" />
  </head>
  <body class="page-app page-history" data-nav-page="history">
    <header id="app-navbar" role="banner"></header>
    <div class="shell app-shell">
      <main class="card motion-rise">
        <h1 class="page-title">Past letters</h1>
        <p class="subtle">Download letters you have already saved. Links work for a short time.</p>
        <div id="alert" aria-live="polite"></div>

        <div class="toolbar-row">
          <label class="search-field">
            <span class="icon" id="search-icon" aria-hidden="true"></span>
            <input
              type="search"
              id="history-search"
              placeholder="Search by template or patient"
              autocomplete="off"
            />
          </label>
          <span class="history-count" id="history-count" aria-live="polite"></span>
        </div>

        <ul id="history-list" class="history-list grid-top" aria-live="polite"></ul>
      </main>
    </div>

    <script src="js/profile-cache.js?v=2" defer></script>
    <script src="js/workspace-cache.js?v=2" defer></script>
    <script src="js/http-client.js?v=2" defer></script>
    <script src="js/api.js?v=2" defer></script>
    <script src="js/paths.js?v=1" defer></script>
    <script src="js/session.js?v=3" defer></script>
    <script src="js/icons.js?v=2" defer></script>
    <script src="js/app-nav.js?v=5" defer></script>
    <script src="js/ui.js?v=5" defer></script>
    <script src="js/history-page.js?v=5" defer></script>
    <script defer>
      document.addEventListener("DOMContentLoaded", () => {
        const node = document.getElementById("search-icon");
        if (node && typeof Icons !== "undefined") {
          node.innerHTML = Icons.svg("search", "icon");
        }
      });
    </script>
  </body>
</html>
