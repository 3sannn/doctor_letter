<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Past letters | Doctor Letter</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <div class="brand">Doctor <span>Letter</span></div>
        <a class="btn btn-ghost" href="dashboard.html">Workspace</a>
      </header>

      <main class="card">
        <h1 style="margin-top: 0">Past letters</h1>
        <p class="subtle">PDF files live in S3. Download links expire after a short time.</p>
        <div id="alert" aria-live="polite"></div>
        <ul id="history-list" class="history-list" style="margin-top: 1.25rem"></ul>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/session.js"></script>
    <script src="js/ui.js"></script>
    <script>
      (async function init() {
        await Session.requireAuth();
        const list = document.getElementById("history-list");
        const alertBox = document.getElementById("alert");

        try {
          const letters = await Api.listLetters();
          list.innerHTML = "";

          if (!letters.length) {
            list.innerHTML =
              '<li class="empty-state">No letters yet. <a href="templates.html">Create your first letter</a>.</li>';
            return;
          }

          letters.forEach((letter) => {
            const item = document.createElement("li");
            item.className = "history-item";
            const patient = letter.patient_name || "Patient";
            item.innerHTML = `
              <div>
                <h3>${letter.template_label}</h3>
                <div class="history-meta">${patient} · ${Ui.formatDate(letter.created_at)}</div>
              </div>
            `;
            const actions = document.createElement("div");
            actions.className = "btn-row";

            const download = document.createElement("button");
            download.type = "button";
            download.className = "btn btn-secondary";
            download.textContent = "Download PDF";
            download.addEventListener("click", async () => {
              Ui.clearAlert(alertBox);
              download.disabled = true;
              try {
                const link = await Api.downloadLetter(letter.id);
                window.open(link.url, "_blank", "noopener,noreferrer");
              } catch (error) {
                Ui.showAlert(alertBox, error.message);
              } finally {
                download.disabled = false;
              }
            });

            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "btn btn-ghost";
            remove.textContent = "Delete";
            remove.addEventListener("click", async () => {
              if (!window.confirm("Remove this letter from your history and from storage?")) {
                return;
              }
              Ui.clearAlert(alertBox);
              remove.disabled = true;
              try {
                await Api.deleteLetter(letter.id);
                item.remove();
                if (!list.children.length) {
                  list.innerHTML =
                    '<li class="empty-state">No letters yet. <a href="templates.html">Create your first letter</a>.</li>';
                }
              } catch (error) {
                Ui.showAlert(alertBox, error.message);
                remove.disabled = false;
              }
            });

            actions.appendChild(download);
            actions.appendChild(remove);
            item.appendChild(actions);
            list.appendChild(item);
          });
        } catch (error) {
          Ui.showAlert(alertBox, error.message);
        }
      })();
    </script>
  </body>
</html>
