<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f1ec" />
    <title>Choose template | Doctor Letter</title>
    <link rel="stylesheet" href="css/main.css?v=3" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <div class="brand">Doctor <span>Letter</span></div>
        <a class="btn btn-ghost" href="dashboard.html">Workspace</a>
      </header>

      <main>
        <section class="card card-accent blank-starter">
          <h2 class="section-title">Write your own letter</h2>
          <p class="subtle">
            Start from a blank page with your clinic details at the top. The same editor is used for every template.
          </p>
          <a class="btn btn-primary" href="editor.html?template=blank-letter">Start blank letter</a>
        </section>

        <section class="card grid-top">
          <h1 class="page-title">Letter templates</h1>
          <p class="subtle">Choose a starting point, then edit every line before you finalize.</p>
          <div id="alert" aria-live="polite"></div>
          <div id="template-sections" class="section-gap" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="js/profile-cache.js?v=2" defer></script>
    <script src="js/template-cache.js?v=2" defer></script>
    <script src="js/http-client.js?v=2" defer></script>
    <script src="js/api.js?v=2" defer></script>
    <script src="js/session.js?v=2" defer></script>
    <script src="js/icons.js?v=2" defer></script>
    <script src="js/ui.js?v=2" defer></script>
    <script src="js/templates-page.js?v=2" defer></script>
  </body>
</html>
