# Render Blueprint — free tier web service + optional health cron (cron may require paid plan; use cron-job.org instead)
services:
  - type: web
    name: doctor-letter
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w ${WEB_CONCURRENCY:-1} -b 0.0.0.0:$PORT
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: OTP_ENABLED
        value: false
      - key: WEB_CONCURRENCY
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_POOL_SIZE
        value: 5
      - key: DB_MAX_OVERFLOW
        value: 5
